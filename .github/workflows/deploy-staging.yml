name: Deploy to Staging

# Staging mirrors the production workflow (.github/workflows/deploy.yml) but
# targets the second Node process on :8946 and its own frontend directory. It
# fires only on the `staging` branch, so pushing to main never touches staging
# and vice versa.
on:
  push:
    branches: [staging]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 1. Get the code ─────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Build the React frontend for staging ─────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: samanviReact/package-lock.json

      - name: Install frontend dependencies
        working-directory: samanviReact
        run: npm ci

      # `--mode staging` picks up .env.staging, which points the app at
      # https://samanvitravels.org.in:8946/nodeapp/ instead of the :8945
      # production API. Output goes to samanviReact/staging/, not dist/, so a
      # staging build can never be mistaken for (or rsynced as) a prod one.
      - name: Build frontend (staging)
        working-directory: samanviReact
        run: npm run build:staging

      # ── 3. SSH setup ────────────────────────────────────────────────────────
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      # ── 4. Sync backend source ──────────────────────────────────────────────
      # Same exclusions as production, and for the same reasons: config/ holds
      # this instance's own DB credentials (that is what makes it a separate
      # environment), uploads/ is live data, and node_modules/package files are
      # server-managed. See deploy.yml for the full rationale.
      - name: Sync backend source to staging server
        run: |
          rsync -avz \
            -e "ssh -i $HOME/.ssh/deploy_key -p ${{ secrets.SERVER_PORT }} -o StrictHostKeyChecking=no" \
            --exclude 'config/' \
            --exclude 'uploads/' \
            --exclude 'node_modules/' \
            --exclude 'package.json' \
            --exclude 'package-lock.json' \
            --exclude 'cert.crt' \
            --exclude 'privatekey.pem' \
            --exclude 'tmp/' \
            samanviBackend/ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.STAGING_BACKEND_PATH }}/

      # ── 5. Restart the staging PM2 app ──────────────────────────────────────
      # No npm install here either — see deploy.yml. The staging process must be
      # started once by hand with PORT=8946 in its environment, e.g.
      #   PORT=8946 FRONTEND_DIR=<STAGING_FRONTEND_PATH> pm2 start app.js --name samanvi-staging
      #   pm2 save
      # PORT defaults to 8945 and FRONTEND_DIR to unset (API only), so an existing
      # production process keeps behaving exactly as it does today.
      # Restarts the process that actually serves :8946 - the one this workflow
      # documents starting as `samanvi-staging` above. The STAGING_PM2_APP_NAME
      # secret was pointing elsewhere: deploy logs showed it restarting pm2 ids
      # 0 and 1 (164 and 176 restarts) while `samanvi-staging` sat at 0 restarts
      # and 19h uptime, so every backend change since this environment was
      # created rsynced fine and then never took effect. Use the name directly
      # so the two cannot drift again; the secret stays as a fallback for a
      # differently-named deployment, and pm2 list makes the next mismatch
      # visible straight from the deploy log.
      # If the process is not in PM2 at all - the deploy user's PM2 daemon was
      # found freshly spawned and empty on 2026-09-12, with staging down on
      # :8946 while production still answered on :8945 - start it here with
      # the same command the note above gives, so a lost daemon never leaves
      # staging dark until someone logs in. The STAGING_PM2_APP_NAME secret is
      # no longer consulted: on the same day it matched the two production-
      # named processes (pm2 ids 0 and 1), so the "fallback" restarted
      # production and left staging down while the deploy reported success.
      - name: Restart PM2 (staging)
        run: |
          ssh -i "$HOME/.ssh/deploy_key" -p ${{ secrets.SERVER_PORT }} -o StrictHostKeyChecking=no \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} '
            set -e
            export PATH="$HOME/bin:$HOME/.npm-global/bin:$PATH"
            if pm2 describe samanvi-staging > /dev/null 2>&1; then
              pm2 restart samanvi-staging --update-env
            else
              echo "samanvi-staging is not in PM2 - starting it on :8946"
              cd "${{ secrets.STAGING_BACKEND_PATH }}"
              PORT=8946 FRONTEND_DIR="${{ secrets.STAGING_FRONTEND_PATH }}" \
                pm2 start app.js --name samanvi-staging
            fi
            pm2 save
            pm2 list
            # Only the schema lines. A column the app adds for itself failing to
            # land is otherwise invisible until a page 500s (staging lost both
            # rejection_reason columns that way on 2026-09-12), and the rest of
            # the log carries live data that has no business in a CI transcript.
            sleep 5
            pm2 logs samanvi-staging --lines 400 --nostream 2>/dev/null | grep "\[DB\]" | tail -25 || echo "no [DB] lines in the log"
          '

      # ── 6. Sync frontend build ──────────────────────────────────────────────
      # --delete clears stale hashed chunks from earlier staging builds. Same
      # cPanel/SSL exclusions as production.
      - name: Sync staging frontend build to server
        run: |
          rsync -avz --delete \
            -e "ssh -i $HOME/.ssh/deploy_key -p ${{ secrets.SERVER_PORT }} -o StrictHostKeyChecking=no" \
            --exclude '.htaccess' \
            --exclude '.user.ini' \
            --exclude '.well-known/' \
            --exclude '*.zip' \
            samanviReact/staging/ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.STAGING_FRONTEND_PATH }}/
