name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 1. Get the code ────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Build the React frontend ────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: samanviReact/package-lock.json

      - name: Install frontend dependencies
        working-directory: samanviReact
        run: npm ci

      - name: Build frontend
        working-directory: samanviReact
        run: npm run build
        # .env.production is committed and sets VITE_API_BASE_URL automatically

      # ── 3. SSH setup ─────────────────────────────────────────────────────
      # The server account has no git repo for the backend (it was set up via
      # manual file upload), so this deploys by rsyncing source files directly
      # rather than `git pull`-ing on the server.
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat >> ~/.ssh/config <<EOF
          Host deploy-target
            HostName ${{ secrets.SERVER_HOST }}
            User ${{ secrets.SERVER_USER }}
            Port ${{ secrets.SERVER_PORT }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking no
          EOF

      # ── 4. Sync backend source ──────────────────────────────────────────────
      # No --delete here: files that exist on the server but not in this repo
      # (e.g. old manual-upload leftovers) are left alone rather than removed,
      # since we don't know which of those are still in use.
      #
      # Hard exclusions — these are server-managed and must never be touched
      # by a deploy:
      #   config/       — holds the server's real DB credentials, not the
      #                   local-dev ones committed in this repo
      #   uploads/      — live user-uploaded files (job cards, receipts, etc.)
      #   node_modules/ — rebuilt on the server, not shipped over the wire
      #   cert.crt / privatekey.pem — server TLS material, gitignored
      #   tmp/          — runtime scratch space
      - name: Sync backend source to server
        run: |
          rsync -avz \
            -e "ssh -F ~/.ssh/config" \
            --exclude 'config/' \
            --exclude 'uploads/' \
            --exclude 'node_modules/' \
            --exclude 'cert.crt' \
            --exclude 'privatekey.pem' \
            --exclude 'tmp/' \
            samanviBackend/ \
            deploy-target:${{ secrets.BACKEND_PATH }}/

      # ── 5. Install deps + restart PM2 ───────────────────────────────────────
      # node/npm/pm2 aren't on the default non-interactive PATH on this host,
      # so the full paths are exported explicitly.
      - name: Install backend deps and restart PM2
        run: |
          ssh -F ~/.ssh/config deploy-target '
            set -e
            export PATH="$HOME/bin:$HOME/.npm-global/bin:$PATH"
            cd "${{ secrets.BACKEND_PATH }}"
            npm install --omit=dev --no-audit --no-fund
            pm2 restart "${{ secrets.PM2_APP_NAME }}"
            pm2 save
          '

      # ── 6. Sync frontend build ──────────────────────────────────────────────
      # --delete here IS safe/desired: it clears out stale hashed JS/CSS
      # chunks from previous builds (and old manual-upload leftovers like
      # stray .zip files) so public_html doesn't accumulate cruft. The
      # excludes protect cPanel/SSL-managed files that live alongside the
      # built app but aren't part of it.
      - name: Sync frontend build to server
        run: |
          rsync -avz --delete \
            -e "ssh -F ~/.ssh/config" \
            --exclude '.htaccess' \
            --exclude '.user.ini' \
            --exclude '.well-known/' \
            --exclude '*.zip' \
            samanviReact/dist/ \
            deploy-target:${{ secrets.FRONTEND_PATH }}/
