name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 1. Get the code ────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Build the React frontend ────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: samanviReact/package-lock.json

      - name: Install frontend dependencies
        working-directory: samanviReact
        run: npm ci

      - name: Build frontend
        working-directory: samanviReact
        run: npm run build
        # .env.production is committed and sets VITE_API_BASE_URL automatically

      # ── 3. Push frontend build + backend to server ─────────────────────────
      # We bundle the built frontend (dist/) + the backend into one SSH session
      # so only one connection is needed.
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          # All commands run as a single script on the remote server
          script: |
            set -e   # stop on any error

            echo "=== Updating backend files ==="
            cd "${{ secrets.BACKEND_PATH }}"
            git pull origin main
            npm install --omit=dev

            echo "=== Restarting PM2 ==="
            pm2 restart "${{ secrets.PM2_APP_NAME }}" \
              || pm2 start app.js --name "${{ secrets.PM2_APP_NAME }}"
            pm2 save

            echo "=== Deploy complete ==="

      # Upload the built React files (dist/) straight to the web root.
      # This runs AFTER the SSH step so the backend is already restarted.
      - name: Upload frontend build to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: 'samanviReact/dist/'
          target: '${{ secrets.FRONTEND_PATH }}'
          strip_components: 2   # removes "samanviReact/dist" prefix, puts files directly in FRONTEND_PATH
          rm: true              # clears old files before copying (avoids stale assets)
