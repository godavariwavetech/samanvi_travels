name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Validate production backend destination
        env:
          BACKEND_PATH: ${{ secrets.BACKEND_PATH }}
        run: |
          test "$BACKEND_PATH" = '/home/samanvitravelsor/api' || {
            echo 'BACKEND_PATH must point to the live /api directory'
            exit 1
          }
      # ── 1. Get the code ────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Build the React frontend ────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: samanviReact/package-lock.json

      - name: Install frontend dependencies
        working-directory: samanviReact
        run: npm ci

      - name: Check permission enforcement and production process selection
        working-directory: samanviReact
        run: |
          npm run test:permissions
          node --test ../samanviBackend/tests/permissions.test.js ../.github/tests/deploy-production.test.cjs

      - name: Build frontend
        working-directory: samanviReact
        run: npm run build
        # .env.production is committed and sets VITE_API_BASE_URL automatically

      # ── 3. SSH setup ─────────────────────────────────────────────────────
      # The server account has no git repo for the backend (it was set up via
      # manual file upload), so this deploys by rsyncing source files directly
      # rather than `git pull`-ing on the server.
      #
      # Connection flags are passed directly to ssh/rsync on every call below
      # rather than via an ~/.ssh/config file — an ssh_config path value isn't
      # tilde-expanded when it arrives inside a double-quoted `-e` string, which
      # previously broke rsync with "Can't open user config file ~/.ssh/config".
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      # ── 4. Sync backend source ──────────────────────────────────────────────
      # No --delete here: files that exist on the server but not in this repo
      # (e.g. old manual-upload leftovers) are left alone rather than removed,
      # since we don't know which of those are still in use.
      #
      # Hard exclusions — these are server-managed and must never be touched
      # by a deploy:
      #   config/       — holds the server's real DB credentials, not the
      #                   local-dev ones committed in this repo
      #   uploads/      — live user-uploaded files (job cards, receipts, etc.)
      #   node_modules/ — never installed/rebuilt automatically (see step 5)
      #   package.json / package-lock.json — the repo's lockfile is stale
      #                   relative to what's actually installed on the server
      #                   (e.g. canvas is really 3.2.3 there, lockfile says
      #                   2.11.2); syncing it would just make step 5 want to
      #                   "fix" that drift again
      #   cert.crt / privatekey.pem — server TLS material, gitignored
      #   tmp/          — runtime scratch space
      - name: Sync backend source to server
        run: |
          rsync -avz \
            -e "ssh -i $HOME/.ssh/deploy_key -p ${{ secrets.SERVER_PORT }} -o StrictHostKeyChecking=no" \
            --exclude 'config/' \
            --exclude 'uploads/' \
            --exclude 'node_modules/' \
            --exclude 'package.json' \
            --exclude 'package-lock.json' \
            --exclude 'cert.crt' \
            --exclude 'privatekey.pem' \
            --exclude 'tmp/' \
            samanviBackend/ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.BACKEND_PATH }}/

      # ── 5. Restart PM2 ────────────────────────────────────────────────────
      - name: Ensure production fuel value-date column
        run: |
          ssh -i "$HOME/.ssh/deploy_key" -p ${{ secrets.SERVER_PORT }} -o StrictHostKeyChecking=no \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} '
            set -e
            export PATH="$HOME/bin:$HOME/.npm-global/bin:$PATH"
            production_ids=$(FUEL_API_ENTRY="${{ secrets.BACKEND_PATH }}/app.js" node -e "
              const path = require(\"path\");
              const cp = require(\"child_process\");
              const expected = path.resolve(process.env.FUEL_API_ENTRY);
              const apps = JSON.parse(cp.execFileSync(\"pm2\", [\"jlist\"], {encoding: \"utf8\"}));
              const ids = apps.filter(a => path.resolve(a.pm2_env.pm_exec_path || \".\") === expected).map(a => a.pm_id);
              if (!ids.length) { console.error(\"Production /api/app.js is not registered in PM2\"); process.exit(1); }
              process.stdout.write(ids.join(\" \"));
            ")
            restart_production() {
              restart_status=$?
              trap - EXIT
              for production_id in $production_ids; do
                PORT=8945 FRONTEND_DIR="" pm2 restart "$production_id" --update-env || true
              done
              exit "$restart_status"
            }
            trap restart_production EXIT
            for production_id in $production_ids; do pm2 stop "$production_id"; done
            sleep 2
            FUEL_DB_CONFIG="${{ secrets.BACKEND_PATH }}/config/dbconnect.js" node -e "
              const db = require(process.env.FUEL_DB_CONFIG);
              const values = [\"fuel_entry\", \"value_date\"];
              const checkSql = \"SELECT COUNT(*) AS count FROM INFORMATION_SCHEMA.COLUMNS WHERE TABLE_SCHEMA = DATABASE() AND TABLE_NAME = ? AND COLUMN_NAME = ?\";
              let attempts = 0;
              function finish(error) {
                if (error) { console.error(\"Fuel value_date migration failed:\", error.message); process.exitCode = 1; }
                else console.log(\"Production fuel_entry.value_date column is ready\");
                db.end();
              }
              function retry(error) {
                if (/too many connections/i.test(error.message) && attempts < 10) {
                  console.log(\"Database is at its connection limit; retrying fuel migration in 2 seconds\");
                  return setTimeout(ensure, 2000);
                }
                finish(error);
              }
              function verify(alterError) {
                db.query(checkSql, values, (error, rows) => {
                  if (error) return retry(error);
                  if (Number(rows[0] && rows[0].count) > 0) return finish(null);
                  retry(alterError || new Error(\"column is still missing after ALTER TABLE\"));
                });
              }
              function ensure() {
                attempts++;
                db.query(checkSql, values, (error, rows) => {
                  if (error) return retry(error);
                  if (Number(rows[0] && rows[0].count) > 0) return finish(null);
                  db.query(\"ALTER TABLE fuel_entry ADD COLUMN value_date DATE DEFAULT NULL\", alterError => verify(alterError));
                });
              }
              ensure();
            "
          '

      # Deliberately NOT running `npm install` here. node_modules on this
      # server has drifted from package-lock.json in a working way (see the
      # canvas note above) — some packages there were hand-upgraded past what
      # the lockfile says. An automatic install tries to reconcile that drift
      # and fails rebuilding native modules (e.g. canvas needs a system
      # pixman-1 lib this shared host doesn't have and can't have installed
      # without root). Adding a genuinely new dependency stays a deliberate,
      # manual `npm install <pkg>` on the server, not part of every push.
      #
      # node/pm2 aren't on the default non-interactive PATH on this host, so
      # the full paths are exported explicitly.
      - name: Restart PM2
        run: |
          ssh -i "$HOME/.ssh/deploy_key" -p ${{ secrets.SERVER_PORT }} -o StrictHostKeyChecking=no \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} '
            set -e
            export PATH="$HOME/bin:$HOME/.npm-global/bin:$PATH"
            # Two processes previously shared the name app: /api and /test_api.
            # Select the production script by path so a deploy cannot restart
            # the test process and make it occupy the production port again.
            production_ids=$(PRODUCTION_SCRIPT="${{ secrets.BACKEND_PATH }}/app.js" node -e "
              const path = require(\"path\");
              const cp = require(\"child_process\");
              const expected = path.resolve(process.env.PRODUCTION_SCRIPT);
              const apps = JSON.parse(cp.execFileSync(\"pm2\", [\"jlist\"], {encoding: \"utf8\"}));
              const ids = apps.filter(a => path.resolve(a.pm2_env.pm_exec_path || \".\") === expected).map(a => a.pm_id);
              if (!ids.length) { console.error(\"Production /api/app.js is not registered in PM2\"); process.exit(1); }
              process.stdout.write(ids.join(\" \"));
            ")
            for production_id in $production_ids; do
              PORT=8945 FRONTEND_DIR="" pm2 restart "$production_id" --update-env
            done
            sleep 5
            PRODUCTION_SCRIPT="${{ secrets.BACKEND_PATH }}/app.js" node -e "
              const path = require(\"path\");
              const cp = require(\"child_process\");
              const expected = path.resolve(process.env.PRODUCTION_SCRIPT);
              const apps = JSON.parse(cp.execFileSync(\"pm2\", [\"jlist\"], {encoding: \"utf8\"}));
              const production = apps.filter(a => path.resolve(a.pm2_env.pm_exec_path || \".\") === expected);
              if (!production.length || production.some(a => a.pm2_env.status !== \"online\")) {
                console.error(\"Production backend did not start successfully\"); process.exit(1);
              }
              console.log(\"Production backend online; fuel value_date was verified before restart\");
            "
            pm2 save
          '

      # ── 6. Sync frontend build ──────────────────────────────────────────────
      # --delete here IS safe/desired: it clears out stale hashed JS/CSS
      # chunks from previous builds (and old manual-upload leftovers like
      # stray .zip files) so public_html doesn't accumulate cruft. The
      # excludes protect cPanel/SSL-managed files that live alongside the
      # built app but aren't part of it.
      # Staging lives inside public_html/staging/ and is deployed separately.
      # Preserve it when deleting files absent from the production build.
      - name: Sync frontend build to server
        run: |
          rsync -avz --delete \
            -e "ssh -i $HOME/.ssh/deploy_key -p ${{ secrets.SERVER_PORT }} -o StrictHostKeyChecking=no" \
            --exclude '.htaccess' \
            --exclude '.user.ini' \
            --exclude '.well-known/' \
            --exclude '/staging/' \
            --exclude '*.zip' \
            samanviReact/dist/ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.FRONTEND_PATH }}/
